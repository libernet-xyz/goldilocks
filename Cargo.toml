[package]
name = "starkom-goldilocks"
version = "2.2.0"
description = "Starkom's implementation of the Goldilocks field."
license = "Apache-2.0"
repository = "https://github.com/libernet-xyz/goldilocks.git"
readme = "README.md"
edition = "2024"

[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0.104"
getrandom = "0.4.3"
primitive-types = "0.14.0"
rand_core = "0.10.1"
starkom-ff = "3.2.0"
subtle = "2.6.1"
